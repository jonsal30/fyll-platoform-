name: Validate Jaravon Growth OS

on:
  pull_request:
    paths:
      - "jaravon-growth-os/**"
      - ".github/workflows/validate-jaravon-growth-os.yml"
  push:
    branches:
      - main
      - agent/jaravon-growth-os-mvp
    paths:
      - "jaravon-growth-os/**"
      - ".github/workflows/validate-jaravon-growth-os.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaravon-growth-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jaravon-growth-os/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/main.py
      - run: pytest -q
