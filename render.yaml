services:
  - type: web
    name: ghsg-workforce-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: ghsg_workforce
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_SHEETS_CLIENT_ID
        sync: false
      - key: GOOGLE_SHEETS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SHEETS_REDIRECT_URI
        sync: false

  - type: web
    name: ghsg-employee-portal
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
